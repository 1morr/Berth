# Berth 的部署套件（plan §9.1）。Linux 與 Windows 共用這一份。
#
#   cp .env.example .env   # 改 DATA_ROOT / CONFIG_ROOT；port 撞到了再改那五個 *_PORT
#   docker compose up -d   # 之後所有設定都在 http://localhost:8383 的精靈裡完成
#
# 已經有 Jellyfin / qBittorrent / Prowlarr 的人，把它從 .env 的 COMPOSE_PROFILES 拿掉，
# 精靈會改用「既有服務」的表單接入（plan §9.5）。berth 沒有 profile，永遠會起。
name: berth

# 固定子網加 berth 的固定 IP：qBittorrent 的免密白名單（preseed/qbittorrent/10-berth.sh）
# 只放這一個位址。白名單放整個網段是不安全的 —— Docker Desktop 把發佈 port 進來的流量的
# 來源位址改寫成閘道（172.28.0.1），而閘道也在網段內，LAN 上任何人都會變成免密。
x-subnet: &subnet 172.28.0.0/16
x-berth-ip: &berth-ip 172.28.0.2

# 四個容器同一組 PUID / PGID / UMASK，硬鏈接兩端的檔案擁有者才會一致（brief §16.1）。
x-ids: &ids
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  UMASK: ${UMASK:-022}
  TZ: ${TZ:-Etc/UTC}

# 五個對外 port 都從 .env 讀（票 06b）；省略時是套件原本的號碼，舊的 .env 照樣能用。
# 只有 Berth 在容器裡看不到的宿主端事實放這裡，其餘設定都在精靈與設定頁（brief §19）。

# 三個外部服務的 image 自己沒有 HEALTHCHECK，這裡補上；berth 的在它的 Dockerfile 裡。
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  start_period: 60s
  retries: 3

networks:
  default:
    name: berth
    ipam:
      config:
        - subnet: *subnet
          # 動態配發限在這一段，berth 的固定 IP 不會被先啟動的容器領走。
          ip_range: 172.28.1.0/24

services:
  berth:
    image: ghcr.io/1morr/berth:latest
    container_name: berth
    restart: unless-stopped
    environment:
      <<: *ids
      # 深連結開套件內 Jellyfin 用的是宿主上的 port，不是容器內的 8096（services/deeplink.py）。
      JELLYFIN_PORT: ${JELLYFIN_PORT:-8096}
      # 套件內 qBittorrent 在 compose 內網上也是這一個號碼（見 qbittorrent 服務）。
      QBITTORRENT_WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
    volumes:
      - ${CONFIG_ROOT:?請在 .env 設定 CONFIG_ROOT}/berth:/config
      - ${DATA_ROOT:?請在 .env 設定 DATA_ROOT}:/data
      # 唯讀掛 Prowlarr 的設定目錄，精靈才讀得到它自動產生的 API key（plan §9.2）。
      - ${CONFIG_ROOT}/prowlarr:/ext/prowlarr:ro
    ports:
      - ${BERTH_PORT:-8383}:8383
    networks:
      default:
        ipv4_address: *berth-ip

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    profiles: [qbittorrent]
    environment:
      <<: *ids
      # 兩個 port 都是內外兩側同一個號碼：WebUI 的 Host 檢查連 port 都比對，`18080:8080` 會讓
      # 瀏覽器開 localhost:18080 吃 401（plan §9.2）；BT 對外公告的 port 要與連得進來的一致。
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-8080}
      TORRENTING_PORT: ${QBITTORRENT_BT_PORT:-6881}
      BERTH_IP: *berth-ip
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
      # 在服務啟動前補上 compose 內網的免密白名單，Berth 才進得去 API（plan §9.2）。
      - ./preseed/qbittorrent:/custom-cont-init.d:ro
    ports:
      - ${QBITTORRENT_WEBUI_PORT:-8080}:${QBITTORRENT_WEBUI_PORT:-8080}
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}
      - ${QBITTORRENT_BT_PORT:-6881}:${QBITTORRENT_BT_PORT:-6881}/udp
    healthcheck:
      # /api/v2/* 要驗證，登入頁不用；這裡只確認 WebUI 活著。
      <<: *healthcheck
      test: [CMD-SHELL, "curl -fsS http://localhost:${QBITTORRENT_WEBUI_PORT:-8080}/ >/dev/null"]

  jellyfin:
    # 釘在 12.1 這條線（brief §19、plan §9.1）：跟得上 12.1 的修正與重建，但 `docker compose pull`
    # 不會默默跨到下一個大版本。12.0 證明那種跨版是不可逆的——它改資料庫、讓插件失效、改變版本
    # 分組。升級步驟（先備份 /config、升完完整掃描）見 README。Berth 支援的下限是 Jellyfin 12.0。
    image: lscr.io/linuxserver/jellyfin:version-12.1ubu2604
    container_name: jellyfin
    restart: unless-stopped
    profiles: [jellyfin]
    environment: *ids
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}:/data
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "curl -fsS http://localhost:8096/health >/dev/null"]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    profiles: [prowlarr]
    environment: *ids
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - ${PROWLARR_PORT:-9696}:9696
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "curl -fsS http://localhost:9696/ping >/dev/null"]
