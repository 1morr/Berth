# e2e（plan §10、票 15）：疊在 deploy/docker-compose.yml 之上，其餘就是使用者起的那一套——
# 真的 qBittorrent、真的 Jellyfin、真的 Prowlarr，Berth 由這份工作目錄 build。
#
#   uv run --env-file .env python -m tests.e2e.stack    # 起、測、拆一次走完（README〈e2e〉）
#
# **不要加 `--wait`**：fixture 要從服務還在啟動時開始偵測（冷啟動，M3 票 06h），等全部健康才開跑
# 的話 `conftest.py` 的第一個斷言就紅。`stack.py` 起完立刻跑 pytest。
#
# **相對路徑相對於第一個檔案所在的 deploy/**，不是這個檔案：compose 把多個 -f 合併成同一個專案。
#
# **與同一台機器上的試跑環境並存**（M4 票 34）：專案名、四個容器名、網路名與子網都在這裡換掉，
# host port 在 e2e.env；產品那一份一個字都不改（使用者看到的容器名是 `berth-*`，票 16）。子網也要換：
# 兩個 Docker 網路的網段重疊時後起的那一個建不起來，所以挑 Docker 自動配發的範圍（172.17–31、
# 192.168）以外的一段，別的專案自動拿到的網段也撞不到它。四份 /config 換成這個專案自己的 named volume
# （合併時以掛載點為準蓋掉產品那一條），`down --volumes` 之後下一輪就是全新的。
# tests/unit/test_e2e_stack.py 守著每一個名字、port 與宿主路徑都換掉了。
name: berth-e2e

networks:
  default:
    name: berth-e2e
    ipam:
      config: !override
        - subnet: 10.231.0.0/16
          ip_range: 10.231.1.0/24

services:
  berth:
    image: berth:e2e
    container_name: berth-e2e
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # 系統的 CA 清單加上 e2e 的測試 CA（`ca-bundle` 寫的）：Berth 的 httpx 讀這個變數，真的 TMDB
      # 與冒充的 Mikan / acg.rip 都驗得過（M3 票 21，`tests/e2e/make_tls.py`）。**檔案不在時 Berth
      # 建不出任何 HTTP client**（連 Jellyfin 的偵測都是），所以它先寫好、Berth 才起來。
      SSL_CERT_FILE: /tls/bundle.pem
    volumes:
      - berth-e2e-tls:/tls:ro
      - berth-e2e-config:/config
      - prowlarr-config:/ext/prowlarr:ro
    networks:
      default:
        # qBittorrent 的免密白名單認這一個位址（產品那一份的 `x-berth-ip`，在這個子網裡）。
        ipv4_address: 10.231.0.2
    depends_on:
      ca-bundle:
        condition: service_completed_successfully

  qbittorrent:
    container_name: berth-e2e-qbittorrent
    environment:
      BERTH_IP: 10.231.0.2
    volumes:
      - qbittorrent-config:/config

  jellyfin:
    container_name: berth-e2e-jellyfin
    volumes:
      - jellyfin-config:/config

  prowlarr:
    container_name: berth-e2e-prowlarr
    volumes:
      - prowlarr-config:/config

  ca-bundle:
    image: python:3.13-alpine
    container_name: berth-e2e-ca-bundle
    command:
      - sh
      - -c
      - cat /etc/ssl/certs/ca-certificates.crt /fixtures/e2e/tls/ca.pem > /tls/bundle.pem
    volumes:
      - berth-e2e-tls:/tls
      - ../tests/fixtures:/fixtures:ro

  torrents:
    # 只用標準庫（`payload.py`），不必等 Berth 的 image build 完。
    image: python:3.13-alpine
    container_name: berth-e2e-torrents
    # 與另外三個容器同一個擁有者：qBittorrent 要搬得動這些檔案，而 Linux 的 protected_hardlinks
    # 不讓 uid 1000 鏈接別人擁有的檔案。
    user: "1000:1000"
    # 不寫 `depends_on: berth: service_healthy`：那會讓 `up -d` 卡到 Berth 的第一次健康檢查
    # （30 秒）才回來，測試開始時外部服務早就起來了。空的 /data 要先由 Berth 的入口腳本接手
    # 擁有者，所以 payload.py 自己等 Berth 回應了才開始寫（`wait_for_berth`）。
    command: [python, /e2e/payload.py]
    volumes:
      - ${DATA_ROOT}:/data
      - ../tests/e2e:/e2e:ro
      - ../tests/fixtures:/fixtures:ro
    healthcheck:
      # http.server 在三包都建好之後才開始聽，所以回得出來就代表資料齊了。
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3

  sites:
    # 公開 RSS 站的替身（M3 票 21，`tests/e2e/sites.py`）：Berth 對這三個主機名的請求都到這一台，
    # 講 HTTPS。同 `torrents`，只用標準庫、uid 1000、先等 Berth 接手 /data 的擁有者。443 是特權
    # port，但 Docker 把容器的 `ip_unprivileged_port_start` 設成 0，uid 1000 聽得了。
    image: python:3.13-alpine
    container_name: berth-e2e-sites
    user: "1000:1000"
    command: [python, /e2e/sites.py]
    volumes:
      - ${DATA_ROOT}:/data
      - ../tests/e2e:/e2e:ro
      - ../tests/fixtures:/fixtures:ro
    networks:
      default:
        aliases: [mikanani.me, nyaa.si, acg.rip]
    healthcheck:
      test: [CMD, test, -f, /data/e2e/m3/ready]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  # e2e.env 的 DATA_ROOT。named volume 而不是 bind mount：發佈名很長，Windows 宿主的 260 字元
  # 路徑上限放不下（票 12 實測）；而 Docker Desktop VM 的 ext4 與 CI 上的 Linux 是同一種檔案系統。
  berth-e2e-data: {}
  berth-e2e-tls: {}
  berth-e2e-config: {}
  qbittorrent-config: {}
  jellyfin-config: {}
  prowlarr-config: {}
