[project]
name = "berth"
version = "0.1.0"
description = "Self-hosted media acquisition and import coordinator"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "guessit>=4.4.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
berth = "berth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["berth"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF"]
# 註解與 docstring 一律繁體中文，全形標點不是筆誤（plan §0）。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["berth"]

[tool.mypy]
python_version = "3.13"
files = ["berth", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# 警告一律當錯誤：相依套件的 deprecation 要在它變成故障之前就被看見。
filterwarnings = [
    "error",
    # Starlette 1.6 的 TestClient 改推 httpx2，但 plan 1.4 的 adapter 測試用 httpx + respx，不跟著分裂。
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    # starlette 自己 import anyio 時觸發的別名警告，與本專案的程式碼無關。
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.importlinter]
root_package = "berth"
# `parser and naming do no IO` 要禁的是 stdlib 與第三方模組，那需要把它們畫進圖裡。
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies point downwards (plan 1.3)"
type = "layers"
containers = ["berth"]
# `naming` 在 `parser` 底下而不是與它並排（M1 票 07）：`plan` 階段要產出目標路徑
# （plan §4.1），而衝突偵測比的就是那條路徑——兩個檔案指到同一個檔名時誰都不能自動入庫。
# 反向不成立：`naming` 只認 `domain` 的快照與 `Tags`。
layers = [
    "api | pipeline",
    "services",
    "adapters | models | parser",
    "naming",
    "db",
    "domain",
]

[[tool.importlinter.contracts]]
name = "api and pipeline call services only"
type = "forbidden"
# 只禁直接 import：`api -> services -> models` 正是 plan §1.3 要的方向，
# 不加這個旗標的話任何經由 services 的間接依賴都會被當成違規。
allow_indirect_imports = true
source_modules = ["berth.api", "berth.pipeline"]
forbidden_modules = [
    "berth.adapters",
    "berth.db",
    "berth.models",
    "berth.naming",
    "berth.parser",
]

[[tool.importlinter.contracts]]
name = "parser and naming depend on domain only"
type = "forbidden"
source_modules = ["berth.parser", "berth.naming"]
forbidden_modules = [
    "berth.adapters",
    "berth.api",
    "berth.db",
    "berth.models",
    "berth.pipeline",
    "berth.services",
]

[[tool.importlinter.contracts]]
name = "naming does not depend on parser"
type = "forbidden"
source_modules = ["berth.naming"]
forbidden_modules = ["berth.parser"]

[[tool.importlinter.contracts]]
# parser 與 naming 是純函式（plan §4、§5）：TMDB 資料以快照物件傳入，檔案清單由呼叫端給。
# 沒有 IO 才有辦法離線跑 benchmark（plan §4.6），也才有辦法在單元測試裡逐條釘規則。
name = "parser and naming do no IO"
type = "forbidden"
source_modules = ["berth.parser", "berth.naming"]
forbidden_modules = [
    "asyncio",
    "http",
    "httpx",
    "io",
    "os",
    "pathlib",
    "shutil",
    "socket",
    "sqlalchemy",
    "sqlite3",
    "subprocess",
    "urllib",
]

[[tool.importlinter.contracts]]
name = "adapters depend on domain only"
type = "forbidden"
source_modules = ["berth.adapters"]
forbidden_modules = [
    "berth.api",
    "berth.db",
    "berth.models",
    "berth.naming",
    "berth.parser",
    "berth.pipeline",
    "berth.services",
]
