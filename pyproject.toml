[project]
name = "berth"
version = "0.1.0"
description = "Self-hosted media acquisition and import coordinator"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
berth = "berth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["berth"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF"]
# 註解與 docstring 一律繁體中文，全形標點不是筆誤（plan §0）。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["berth"]

[tool.mypy]
python_version = "3.13"
files = ["berth", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.importlinter]
root_package = "berth"

[[tool.importlinter.contracts]]
name = "Dependencies point downwards (plan 1.3)"
type = "layers"
containers = ["berth"]
layers = [
    "api | pipeline",
    "services",
    "adapters | models | parser | naming",
    "db",
    "domain",
]

[[tool.importlinter.contracts]]
name = "api and pipeline call services only"
type = "forbidden"
source_modules = ["berth.api", "berth.pipeline"]
forbidden_modules = [
    "berth.adapters",
    "berth.db",
    "berth.models",
    "berth.naming",
    "berth.parser",
]

[[tool.importlinter.contracts]]
name = "parser and naming depend on domain only"
type = "forbidden"
source_modules = ["berth.parser", "berth.naming"]
forbidden_modules = [
    "berth.adapters",
    "berth.api",
    "berth.db",
    "berth.models",
    "berth.pipeline",
    "berth.services",
]

[[tool.importlinter.contracts]]
name = "adapters depend on domain only"
type = "forbidden"
source_modules = ["berth.adapters"]
forbidden_modules = [
    "berth.api",
    "berth.db",
    "berth.models",
    "berth.naming",
    "berth.parser",
    "berth.pipeline",
    "berth.services",
]
