# Human-operated Alembic only (`uv run alembic revision --autogenerate`, `uv run alembic current`).
# The app applies migrations through berth.db.upgrade_to_head and never reads this file.
# No sqlalchemy.url here: env.py derives the database path from CONFIG_ROOT.
# ASCII only -- Alembic reads this file with the OS locale encoding, not UTF-8.
[alembic]
script_location = berth/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
