name: e2e

# plan §10：真的 qBittorrent、Jellyfin（Prowlarr 也起，但精靈跳過索引站），加上這一份工作目錄
# build 的 Berth，把 M1 的整條路徑、M1.5 的權限與瀏覽、M2 的修正與對帳、M3 的 RSS 各走一遍（tests/e2e/，
# 一輪 compose 四個模組共享；公開 RSS 站由 `sites` 容器冒充）。
# 一輪約 20 分鐘——套件內的媒體庫一開始是空的，Jellyfin 的反查要等 Berth 請它掃描之後那一輪——
# 所以不在每個 push 上跑，只在 nightly 與發版。
on:
  schedule:
    - cron: '23 18 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      # 與本機同一條指令（docs/development.md〈e2e〉）：拆掉殘留 → build → `up`（**不加 `--wait`**，冷啟動
      # 閘門，票 06h）→ pytest → 失敗時印容器狀態與 log → 一定 `down --volumes`（`tests/e2e/stack.py`）。
      - run: uv run python -m tests.e2e.stack
        env:
          # 精靈 TMDB 那一頁是閘門（票 02b）：沒有一把驗得過的 key，走不到建 Route。
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
