name: e2e

# plan §10：真的 qBittorrent、Jellyfin（Prowlarr 也起，但精靈跳過索引站），加上這一份工作目錄
# build 的 Berth，把 M1 的整條路徑、M1.5 的權限與瀏覽、M2 的修正與對帳、M3 的 RSS 各走一遍（tests/e2e/，
# 一輪 compose 四個模組共享；公開 RSS 站由 `sites` 容器冒充）。
# 一輪約 15 分鐘——套件內的媒體庫一開始是空的，Jellyfin 的反查要等 Berth 請它掃描之後那一輪——
# 所以不在每個 push 上跑，只在 nightly 與發版。
on:
  schedule:
    - cron: '23 18 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 與 README〈e2e〉的 -f / --env-file 是同一組，寫成環境變數之後每一步都不必重複。
      COMPOSE_FILE: deploy/docker-compose.yml:tests/e2e/compose.yml
      COMPOSE_ENV_FILES: tests/e2e/e2e.env
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      # compose 的 CONFIG_ROOT 是宿主上的目錄；runner.temp 在 job 層級的 env 裡還讀不到。
      - run: echo "CONFIG_ROOT=$RUNNER_TEMP/berth-e2e-config" >> "$GITHUB_ENV"

      # 先 build、先把 image 拉下來，`up` 才是四個容器同時從零啟動。
      - run: docker compose build && docker compose pull --ignore-buildable

      # **冷啟動閘門（票 06h）：不加 `--wait`。** 測試在 Berth 一回應就開始精靈，這時 Jellyfin 與
      # Prowlarr 還在啟動；`--wait` 會等到四個都健康，精靈就永遠碰不到那幾秒（票 06g 的缺陷）。
      - run: docker compose up --detach

      - run: uv run pytest -m e2e tests/e2e -rA
        env:
          # 精靈第 6 步是閘門（票 02b）：沒有一把驗得過的 key，走不到建 Route。
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - if: always()
        run: docker compose down --volumes
