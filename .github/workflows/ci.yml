name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 在任一分支上手動跑一次（例如故意改壞一個選擇器，看 web-e2e 紅得起來、證據撿得到）。
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      # plan §10 的「前端 e2e」：playwright 對演練情境（scripts/fake_setup_server.py）跑四條流程。
      # 替身全在程序裡，不打真的索引站與 TMDB，所以每個 push 都跑得起。server 發的是 web/dist。
      - run: pnpm build
        working-directory: web
      - run: pnpm e2e
        working-directory: web

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          # 失敗那一條的截圖、trace（`pnpm exec playwright show-trace <zip>`）與 HTML 報告。
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14

  api-types:
    name: api-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: web

      # 前端的 API 型別是產出的（README「API 型別」）。後端改了 pydantic model 卻沒有
      # 重跑產生器時，重產之後這個檔案就會有 diff——那正是要紅燈的情況。
      - run: pnpm gen:api
        working-directory: web
      - run: git diff --exit-code -- src/api/schema.d.ts
        working-directory: web

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 只 build 不推：發佈是 release.yml 的事，這裡顧的是 Dockerfile 不要壞掉。
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --locked

      # 需要 uv / pnpm 的那些 hook 已由上面兩個 job 跑過，這裡只補它們沒涵蓋的檔案衛生。
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy,lint-imports,web-format,web-lint
