name: Release

# 版本 tag 才發佈；日常的 image 是否 build 得起來由 CI 的 image job 顧。
on:
  push:
    tags: ['v*']

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/berth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # compose 範本 pin 的就是 :latest，預發佈 tag（v1.0.0-rc1）不能動到它。
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release 頁只放這一版的說明，不附任何檔案（M4 票 71、brief §19 E4）：部署只要 compose 檔加 `.env`，
  # README 連到這個 tag 底下的 deploy/ 原始檔。等 image 推完才建，Release 頁出現時 image 一定拉得到。
  # 說明是 CHANGELOG 的 `## [<版本>]` 那一段，相對連結換成這個 tag 底下的 blob（Release 頁上相對連結會壞）。
  # 預發佈 tag（含 `-`）標成 prerelease。重跑同一個 tag（或 release 已經手動建了）只更新說明。
  release:
    name: release notes
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/"
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -E "s#\]\((\./)?([^)#:][^):]*)\)#](${blob}\2)#g" >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## [${TAG#v}]' section" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --notes-file notes.md)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
