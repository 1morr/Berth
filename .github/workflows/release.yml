name: Release

# 版本 tag 才發佈；日常的 image 是否 build 得起來由 CI 的 image job 顧。
on:
  push:
    tags: ['v*']

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/berth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # compose 範本 pin 的就是 :latest，預發佈 tag（v1.0.0-rc1）不能動到它。
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署檔的 zip（M4 票 56、brief §19 E4、§20.17）：使用者下載它、不 clone repo。等 image 推完才建
  # release，README 的「最新版」連結指到的那一版一定拉得到 image。預發佈 tag（含 `-`）標成
  # prerelease，`releases/latest/download/` 就不會指到它。重跑同一個 tag（或 release 已經手動建了）只重傳附件。
  bundle:
    name: deploy bundle
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      # 只用標準庫，不必 sync 整個專案；本機用的是同一支（docs/development.md〈部署套件〉）。
      - run: uv run --no-project python scripts/deploy_bundle.py "$GITHUB_REF_NAME" --out dist

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 帶附件的 create 先建草稿、傳完才發佈：latest/download 不會有一段指到沒有附件的新版。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            exit 0
          fi
          flags=(--verify-tag --title "$TAG")
          flags+=(--notes "Changes and upgrade notes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md")
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.zip "${flags[@]}"
