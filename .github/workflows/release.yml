name: Release

# 版本 tag 才發佈；日常的 image 是否 build 得起來由 CI 的 image job 顧。
# **測試是閘門**：這個 tag 的 commit 先跑完整的 CI、再跑真服務的 e2e（約 50 分鐘），都綠了才推 image、建 Release。
# 0.4.0 以前三個 workflow 各自由 tag 觸發、互不等待，image 推完 e2e 才開始跑。e2e build 自己的 Berth
# （tests/e2e/stack.py），不用這裡推的 image，所以不必先推再驗。tests/unit/test_release_gate.py 守著這個順序。
on:
  push:
    tags: ['v*']

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  e2e:
    name: e2e
    needs: ci
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    secrets: inherit

  image:
    name: image
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/berth
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # compose 範本 pin 的就是 :latest，預發佈 tag（v1.0.0-rc1）不能動到它。
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release 附上部署的兩個檔（M4 票 97，推翻票 71 的不附檔案）：README 連到 `releases/latest/download/<附件名>`，
  # 永遠是最新正式版的附件，發版不必換連結。等 image 推完才建，Release 頁出現時 image 一定拉得到。
  # 說明是 CHANGELOG 的 `## [<版本>]` 那一段，相對連結換成這個 tag 底下的 blob（Release 頁上相對連結會壞）。
  # 預發佈 tag（含 `-`）標成 prerelease，`latest` 不會指到它。重跑同一個 tag（或 release 已經手動建了）只更新說明、
  # 以 --clobber 覆蓋附件。附件與名字由 tests/unit/test_readme_docs.py 守著。
  release:
    name: release notes
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 檔案取自這個 tag 的 checkout。GitHub 會改掉開頭是 `.` 的附件名（brief §20.17），
      # 所以 `.env.example` 照 Immich 叫 `example.env`。
      - name: stage deploy files
        run: |
          mkdir assets
          cp deploy/docker-compose.yml assets/docker-compose.yml
          cp deploy/.env.example assets/example.env

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/"
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -E "s#\]\((\./)?([^)#:][^):]*)\)#](${blob}\2)#g" >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## [${TAG#v}]' section" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --notes-file notes.md)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" assets/*
